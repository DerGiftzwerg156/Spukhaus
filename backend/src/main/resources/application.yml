spring:
  application:
    name: spukhaus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/spukhaus}
    username: ${DB_USERNAME:spukhaus}
    password: ${DB_PASSWORD:spukhaus}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:spukhaus}
  secret-key: ${MINIO_SECRET_KEY:spukhaus123}
  bucket: ${MINIO_BUCKET:spukhaus-designs}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
