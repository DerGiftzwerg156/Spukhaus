spring:
  application:
    name: spukhaus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/spukhaus}
    username: ${DB_USERNAME:spukhaus}
    password: ${DB_PASSWORD:spukhaus}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    # Entities werden über mehrere Service-Aufrufe hinweg innerhalb einer Anfrage weitergereicht
    # (z.B. Controller lädt ein Design und ruft danach mehrere Service-Methoden darauf auf).
    # open-in-view hält den Persistence-Context für die gesamte Anfrage offen, damit das
    # funktioniert, ohne dass Entities zwischen den Aufrufen detached werden.
    open-in-view: true
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  flyway:
    enabled: true

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:spukhaus}
  secret-key: ${MINIO_SECRET_KEY:spukhaus123}
  bucket: ${MINIO_BUCKET:spukhaus-designs}

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-in-production-min-32-bytes}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

spukhaus:
  bootstrap:
    tech-admin-username: ${BOOTSTRAP_TECH_ADMIN_USERNAME:techadmin}
    tech-admin-password: ${BOOTSTRAP_TECH_ADMIN_PASSWORD:eiX1eu7v1}
    tech-admin-display-name: ${BOOTSTRAP_TECH_ADMIN_DISPLAY_NAME:Tech Admin}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
