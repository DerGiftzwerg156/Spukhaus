services:
  mariadb:
    image: mariadb:11.4
    container_name: spukhaus-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: spukhaus
      MARIADB_USER: spukhaus
      MARIADB_PASSWORD: spukhaus
      MARIADB_ROOT_PASSWORD: spukhaus-root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: spukhaus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: spukhaus
      MINIO_ROOT_PASSWORD: spukhaus123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb-data:
  minio-data:
