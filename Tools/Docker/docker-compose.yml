#    depends_on:
#      minio:
#        condition: service_healthy
#    entrypoint: >
#      /bin/sh -c "
#      mc alias set local http://minio:9000 spukhaus spukhaus123 &&
#      mc mb --ignore-existing local/spukhaus-designs
