  backend:
    build:
      context: ../../backend
    container_name: spukhaus-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mariadb://mariadb:3306/spukhaus
      DB_USERNAME: spukhaus
      DB_PASSWORD: spukhaus
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: spukhaus
      MINIO_SECRET_KEY: spukhaus123
      MINIO_BUCKET: spukhaus-designs
      JWT_SECRET: kfhszfh38fks89fke8stw2mdlo9dzfjeß
      BOOTSTRAP_TECH_ADMIN_USERNAME: ${BOOTSTRAP_TECH_ADMIN_USERNAME:-techadmin}
      BOOTSTRAP_TECH_ADMIN_PASSWORD: eiX1eu7v+1
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../../frontend
    container_name: spukhaus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mariadb-data:
  minio-data:
