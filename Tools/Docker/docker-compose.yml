services:
  mariadb:
    image: mariadb:11
    container_name: spukhaus-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: spukhaus
      MARIADB_USER: spukhaus
      MARIADB_PASSWORD: spukhaus
      MARIADB_ROOT_PASSWORD: spukhaus-root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Das offizielle Image "minio/minio" wurde von Docker Hub entfernt (MinIO veröffentlicht seit
  # Okt. 2025 keine Images mehr). Chainguard baut MinIO weiterhin aus den Quellen – Datenformat,
  # Ports und Zugangsdaten bleiben identisch. Die "-dev"-Variante enthält eine Shell (busybox) für
  # den Healthcheck. Läuft als root, damit bestehende (root-eigene) Volumes weiter beschreibbar sind.
  minio:
    image: chainguard/minio:latest-dev
    container_name: spukhaus-minio
    restart: unless-stopped
    user: "0:0"
    environment:
      MINIO_ROOT_USER: spukhaus
      MINIO_ROOT_PASSWORD: spukhaus123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../../backend
    container_name: spukhaus-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mariadb://mariadb:3306/spukhaus
      DB_USERNAME: spukhaus
      DB_PASSWORD: spukhaus
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: spukhaus
      MINIO_SECRET_KEY: spukhaus123
      MINIO_BUCKET: spukhaus-designs
      JWT_SECRET: kfhszfh38fks89fke8stw2mdlo9dzfjeß
      BOOTSTRAP_TECH_ADMIN_USERNAME: ${BOOTSTRAP_TECH_ADMIN_USERNAME:-techadmin}
      BOOTSTRAP_TECH_ADMIN_PASSWORD: eiX1eu7v+1
      SPUKHAUS_CORS_ALLOWED_ORIGINS: http://localhost:8081,http://192.168.178.48:8081
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../../frontend
    container_name: spukhaus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mariadb-data:
  minio-data:
