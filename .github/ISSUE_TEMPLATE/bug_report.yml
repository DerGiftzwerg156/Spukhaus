name: Bug Report
description: Einen Fehler im Spukhaus-Tool melden
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du einen Fehler meldest! Bitte fülle die folgenden Felder so genau wie möglich aus.

  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist das Problem?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. Gehe zu ...
        2. Klicke auf ...
        3. Fehler tritt auf
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Betroffene Komponente
      options:
        - Frontend (Web)
        - Frontend (Android/Capacitor)
        - Backend
        - Infrastruktur (Docker/CI)
        - Unbekannt
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      placeholder: Browser/OS-Version, App-Version, etc.
    validations:
      required: false
